
services:
  # App services use host network: same PostgreSQL (127.0.0.1:5432) and Redis
  # (127.0.0.1:6379) as local runserver. No Docker Postgres/Redis containers.
  web:
    build: .
    network_mode: host
    command: daphne -b 0.0.0.0 -p 8000 hrms.asgi:application
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: hrms.settings
      SECRET_KEY: django-insecure-u!bn7xcz3ad02@n0f&v-l@lq+=(d&jt@f!(yro=@%=n#%3n&4_
      TZ: "Asia/Kolkata"
    env_file:
      - .env.docker

  celery:
    build: .
    network_mode: host
    command: celery -A hrms worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: hrms.settings
      SECRET_KEY: django-insecure-u!bn7xcz3ad02@n0f&v-l@lq+=(d&jt@f!(yro=@%=n#%3n&4_
      TZ: "Asia/Kolkata"
    env_file:
      - .env.docker
    restart: unless-stopped

  celery-beat:
    build: .
    network_mode: host
    command: celery -A hrms beat --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: hrms.settings
      SECRET_KEY: django-insecure-u!bn7xcz3ad02@n0f&v-l@lq+=(d&jt@f!(yro=@%=n#%3n&4_
      TZ: "Asia/Kolkata"
    env_file:
      - .env.docker
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web
    restart: unless-stopped